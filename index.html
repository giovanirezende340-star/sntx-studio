<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNTX Studio - AI Stylist & Halftone Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .canvas-bg { background-image: radial-gradient(#222 1px, transparent 0); background-size: 16px 16px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-neutral-800 p-4 flex justify-between items-center bg-black/50 backdrop-blur">
        <div class="flex items-center gap-2">
            <span class="text-xl font-black tracking-widest text-white">SNTX<span class="text-red-500">.</span>STUDIO</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm bg-neutral-800 px-3 py-1 rounded-full border border-neutral-700">
                Créditos: <strong id="user-credits" class="text-green-400">3</strong>
            </span>
            <button id="btn-subscribe" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                Assinar R$ 19,99/mês
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Controls Panel -->
        <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col gap-5">
            <h2 class="text-lg font-bold text-neutral-200 border-b border-neutral-800 pb-2">Estilista IA & Estampa</h2>
            
            <!-- Prompt -->
            <div>
                <label class="block text-xs font-semibold text-neutral-400 mb-2">Conceito da Arte (Prompt)</label>
                <textarea id="prompt-input" rows="3" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm focus:outline-none focus:border-neutral-600" placeholder="Ex: Crânio cyberpunk em estilo gravura vintage, alto contraste..."></textarea>
            </div>

            <!-- Style Selector -->
            <div>
                <label class="block text-xs font-semibold text-neutral-400 mb-2">Estilo de Estampa</label>
                <select id="style-preset" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm focus:outline-none focus:border-neutral-600">
                    <option value="streetwear-vintage">Streetwear Vintage (Gravura)</option>
                    <option value="cyberpunk-acid">Cyberpunk Acid Graphics</option>
                    <option value="minimalist-typography">Tipografia Minimalista Urban</option>
                </select>
            </div>

            <!-- Halftone Controls -->
            <div class="border-t border-neutral-800 pt-4">
                <h3 class="text-xs font-bold text-neutral-300 uppercase tracking-wider mb-3">Motor de Retícula (Halftone)</h3>
                
                <label class="block text-xs text-neutral-400 mb-1">Tamanho do Ponto (LPI)</label>
                <input type="range" id="dot-size" min="2" max="20" value="6" class="w-full accent-red-500 mb-4">

                <label class="block text-xs text-neutral-400 mb-1">Contraste / Knockout</label>
                <input type="range" id="contrast" min="1" max="5" value="2" step="0.1" class="w-full accent-red-500">
            </div>

            <!-- Actions -->
            <button id="btn-generate" class="mt-auto w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-neutral-200 transition shadow-lg">
                Gerar Estampa com IA (1 Crédito)
            </button>
        </section>

        <!-- Canvas Preview Area -->
        <section class="lg:col-span-2 bg-neutral-900 border border-neutral-800 rounded-2xl p-5 flex flex-col items-center justify-center min-h-[400px] canvas-bg relative">
            <div id="preview-container" class="relative w-full max-w-md h-full flex items-center justify-center">
                <canvas id="halftone-canvas" class="max-w-full max-h-[450px] rounded-lg border border-neutral-800 shadow-2xl bg-black"></canvas>
            </div>
            
            <div class="mt-4 flex gap-3">
                <button id="btn-export" class="bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-semibold px-4 py-2 rounded-lg border border-neutral-700 transition">
                    Exportar 300 DPI (PNG)
                </button>
            </div>
        </section>

    </main>

    <!-- Modal Pix / Assinatura -->
    <div id="pix-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl max-w-sm w-full text-center">
            <h3 class="text-lg font-bold text-white mb-2">Plano Starter - SNTX Studio</h3>
            <p class="text-xs text-neutral-400 mb-4">R$ 19,99/mês • 12 Créditos de Geração + Exportação HQ</p>
            
            <div id="qr-code-area" class="bg-white p-4 rounded-xl inline-block mb-4">
                <p class="text-xs text-neutral-600">A gerar Código Pix...</p>
            </div>

            <button id="btn-close-modal" class="w-full bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-semibold py-2 rounded-lg transition">
                Fechar
            </button>
        </div>
    </div>

    <script>
        // Inicialização dos elementos do DOM
        const btnSubscribe = document.getElementById('btn-subscribe');
        const pixModal = document.getElementById('pix-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');

        btnSubscribe.addEventListener('click', () => {
            pixModal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => {
            pixModal.classList.add('hidden');
        });
    </script>
</body>
</html>
